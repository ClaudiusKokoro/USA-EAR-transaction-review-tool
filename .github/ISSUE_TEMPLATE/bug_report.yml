name: Bug report
description: Report something that does not work as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem.

        **Please do not paste real transaction data, party names, customer names, or API keys.**
        Replace them with obviously fake examples such as `Example Exporter` or `Acme Buyer`.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and any error message you saw.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the workbench with start-windows.bat (or ./start.sh)
        2. Go to Step 6 ...
        3. Click ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Which part of the tool?
      options:
        - Review workbench (app/main.py)
        - AI assistant (app/ai_main.py)
        - List & Data Center (screening list sync)
        - Rules / scoring engines
        - Report generation
        - Launchers / installation
        - Other
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 / macOS 14 / Ubuntu 24.04
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output or traceback
      description: Paste the console output from the terminal window if there is one.
      render: text
    validations:
      required: false
