name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: pytest (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run the test suite
        run: python -m pytest -q

      - name: Verify the launchers are present
        if: runner.os != 'Windows'
        run: |
          test -f start.sh
          test -f start-ai-frontend.sh

      - name: Verify the launchers are present (Windows)
        if: runner.os == 'Windows'
        run: |
          if (-not (Test-Path "start-windows.bat")) { exit 1 }
          if (-not (Test-Path "start-all.bat")) { exit 1 }
        shell: pwsh
